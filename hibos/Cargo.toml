[package]
name = "hibos"
version = "0.1.0"
edition = "2021"
authors = ["logos-42"]
license = "MIT"

[lib]
name = "hibos"
path = "lib.rs"

[[bin]]
name = "hibos"
path = "kernel/mod.rs"
# 库目标已包含同一棵模块树及其全部 #[cfg(test)]；
# 若 bin 也跑测试，会重复执行 2000+ 用例，故关闭。
test = false
bench = false

[dependencies]
ureq = "2"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[features]
default = []
# 真实窗口后端：winit 事件循环 + softbuffer 软件光栅输出。
gui = ["dep:winit", "dep:softbuffer"]
