[package]
name = "hibos"
version = "0.1.0"
edition = "2021"
authors = ["logos-42"]
license = "MIT"

[lib]
name = "hibos"
path = "lib.rs"

[[bin]]
name = "hibos"
path = "kernel/mod.rs"
# 用户态 shell 入口（std 环境），保留用于在宿主 OS 上运行原型。
test = false
bench = false

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[features]
default = []
# 真实窗口后端：winit 事件循环 + softbuffer 软件光栅输出。
gui = ["dep:winit", "dep:softbuffer"]
