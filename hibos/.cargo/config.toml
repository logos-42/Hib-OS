# 注意：不要在此处全局设置 target = "x86_64-unknown-none"。
# 该 target 仅用于裸机内核构建，由 build.ps1 / build_kernel.ps1 通过
# `cargo build --target x86_64-unknown-none` 显式传入。若在 [build] 中
# 全局指定，会导致 serde/ureq 等依赖被强制编译为 no_std 而编译失败。
# 宿主环境下的 cargo check / cargo test 应使用默认目标 (x86_64-pc-windows-msvc)。

[target.x86_64-unknown-none]
linker = "C:\\Users\\Mechrevo\\.rustup\\toolchains\\1.99.1-x86_64-pc-windows-msvc\\lib\\rustlib\\x86_64-pc-windows-msvc\\bin\\gcc-ld\\ld.lld.exe"
rustflags = [
  "-C", "linker-flavor=ld",
  "-C", "link-arg=-T../boot/linker.ld",
  "-C", "link-arg=-nostdlib",
  "-C", "link-arg=-e",
  "-C", "link-arg=kernel_main",
]
